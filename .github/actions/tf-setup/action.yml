name: Terraform setup (Yandex Cloud)
description: Install Terraform, write Yandex Cloud credentials, and run terraform init against the remote S3 state.

inputs:
  yc_sa_key_json:
    description: Authorized-key JSON for the CI service account (provider auth).
    required: true
  state_s3_access_key:
    description: Static access key ID for the Terraform state bucket.
    required: true
  state_s3_secret_key:
    description: Static secret key for the Terraform state bucket.
    required: true
  worker_ssh_public_key:
    description: SSH public key installed on the ingestion worker.
    required: true

runs:
  using: composite
  steps:
    - name: Install Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.14.5"
        # Keep the wrapper so step outputs (stdout/exitcode) are captured for PR comments.
        terraform_wrapper: true

    - name: Write Yandex Cloud service-account key
      shell: bash
      run: |
        printf '%s' '${{ inputs.yc_sa_key_json }}' > "$RUNNER_TEMP/yc-sa-key.json"
        echo "YC_SERVICE_ACCOUNT_KEY_FILE=$RUNNER_TEMP/yc-sa-key.json" >> "$GITHUB_ENV"

    - name: Write worker SSH public key
      shell: bash
      run: |
        mkdir -p "$HOME/.ssh"
        printf '%s\n' '${{ inputs.worker_ssh_public_key }}' > "$HOME/.ssh/id_ed25519.pub"

    - name: terraform init (remote state)
      shell: bash
      working-directory: infra/terraform
      env:
        # The S3 backend authenticates with the state-bucket static key.
        AWS_ACCESS_KEY_ID: ${{ inputs.state_s3_access_key }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.state_s3_secret_key }}
      run: terraform init -input=false
